# The source registry — reviewed feeds for the daily edition
#
# This file is the allowlist for the content pipeline. Every active entry below
# has a public feed, a terms or licensing reference, a recorded review date and
# reviewer, a publisher-specific permitted-use note, and the required credit.
# The registry validator rejects unsafe URLs, incomplete active reviews,
# duplicate feeds, and reserved sample hosts.
#
# The current active set deliberately favours official and primary material
# while the product secures permissions from independent Indian publishers.
# Official statements must remain labelled as official in the edition; they are
# not independent verification. Publisher photography is never fetched.
#
# `faran` is the maintainer handle approved for this review pass. Takedown and
# correction contacts belong in the pull request because the v1 registry schema
# has no contact field; each source's public site remains the canonical channel.

schemaVersion: 1

