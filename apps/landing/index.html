<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'self'; base-uri 'self'; form-action 'self';"
    />
    <!-- Two, because browser chrome has to agree with the page under it. A
         single value painted cream chrome above a #181b18 page for every reader
         on a dark device. The values are the palette's two `--surface` values.

         No pre-paint script here, unlike the reader: the landing page stores
         nothing on a device and offers no appearance control, so the OS is the
         only opinion there is and the media queries alone answer it. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f4ef"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#181b18"
    />
    <title>Aaj, Bas. — Today's news. That's enough.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
