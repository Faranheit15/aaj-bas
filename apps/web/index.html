<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-qaNcimh8zWgGg7uPkR5jUSqiClq1ztSH+myPsxgGUU0='; style-src 'self' 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'self'; base-uri 'self'; form-action 'self';"
    />
    <!-- Two, because the browser chrome must agree with the page under it; a
         single value painted cream chrome above a dark page. They follow the
         OS, not `data-theme` — see ADR-0009. Asserted equal to the palette's
         two `--surface` values, so a palette change cannot leave them behind. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f4ef"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#181b18"
    />
    <title>Aaj, Bas.</title>
    <!-- The manifest carries one `theme_color` where the metas above carry
         two, and it ships no icons at all. JSON has no comments, so the whole
         argument for both — including why the missing icons are the mechanism
         that keeps this slice free of an install prompt — is in
         `src/manifest.test.ts`, which is also where it is asserted. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The reader's stored appearance, applied before the first paint.

         MUST stay a classic, synchronous script. `type="module"`, `defer` or
         `async` each move it after the paint and reintroduce the flash
         invisibly, so its shape is asserted as well as its behaviour.
         `schemaVersion === 1` is not optional: ADR-0007 forbids reading a
         document a newer build wrote. Only "light" and "dark" are ever
         applied, so every other input leaves the OS deciding. A future CSP
         (AB-903) must carry this script's sha256 hash rather than reaching for
         'unsafe-inline'. The full argument is in ADR-0009. -->
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem("aaj-bas.local-state"));
        const theme = stored.schemaVersion === 1 ? stored.theme : null;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <!-- With scripting off the placeholder below is never replaced, so leaving
         it visible would say the edition is loading directly above the notice
         explaining that it cannot. Exactly one of the two is shown. -->
    <noscript>
      <style>
        #root {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!-- One line, and it must stay one line. React replaces the container's
         children on mount, so anything richer here would be a second copy of
         the header and footer, drifting from the shell that renders them. -->
    <div id="root"><p>Loading the edition.</p></div>
    <noscript>
      <p>
        The reader needs JavaScript to show an edition. The published content is
        plain JSON and can be read without it, starting at
        <a href="/content/latest.json">/content/latest.json</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
