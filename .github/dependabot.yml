# Dependency update configuration.
#
# Two ecosystems, both rooted at the repository root:
#
# - `bun` keeps the workspace current and updates `bun.lock`. The `npm`
#   ecosystem would work on the same manifests but write `package-lock.json`,
#   which section 8 of AGENTS.md forbids and `bun run check:pm` fails on. The
#   Bun workspace resolves every `apps/*` and `packages/*` manifest from the
#   root lockfile, so one entry covers all of them.
# - `github-actions` watches the workflow itself. `oven-sh/setup-bun` and
#   `cloudflare/wrangler-action` are pinned to floating major tags and handle
#   deployment credentials, so a stale or repointed action is a security
#   concern, not just a maintenance one (section 44).
#
# Minor and patch updates are grouped into one pull request per ecosystem to
# keep review cost proportional. Major updates arrive separately because
# section 36 requires the changelog to be read and the reason stated.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      workspace-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
