name: Daily Edition Draft

on:
  schedule:
    # 00:30 UTC = 06:00 Asia/Kolkata daily editorial cycle
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target edition date (YYYY-MM-DD, defaults to India calendar date)"
        required: false
        type: string
      dry_run:
        description: "Generate artifacts without pushing branch or opening PR"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Determine and validate edition date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            if ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]]; then
              echo "::error::Invalid date format '$INPUT_DATE'. Must be strict YYYY-MM-DD."
              exit 2
            fi
            echo "edition_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            DATE=$(bun -e 'import { editorialDateInIndia } from "@aaj-bas/domain"; console.log(editorialDateInIndia())')
            echo "edition_date=$DATE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily draft PR workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
          EDITION_DATE: ${{ steps.date.outputs.edition_date }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$IS_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          bun scripts/open-daily-draft-pr.ts --date "$EDITION_DATE" --use-ai --step-summary $DRY_RUN_FLAG
