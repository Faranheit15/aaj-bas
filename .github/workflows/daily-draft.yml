name: Daily Edition Draft

on:
  schedule:
    # 00:30 UTC = 06:00 Asia/Kolkata daily editorial cycle
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target edition date (YYYY-MM-DD, defaults to India calendar date)"
        required: false
        type: string
      dry_run:
        description: "Generate artifacts without pushing branch or opening PR"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Determine edition date
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "edition_date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            DATE=$(bun -e 'import { editorialDateInIndia } from "@aaj-bas/domain"; console.log(editorialDateInIndia())')
            echo "edition_date=$DATE" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate draft edition artifacts
        id: generate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          DATE="${{ steps.date.outputs.edition_date }}"
          echo "Generating draft edition for $DATE..."
          bun scripts/generate-draft-edition.ts --date "$DATE" --step-summary --use-ai || true

      - name: Create or update draft branch and pull request
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.edition_date }}"
          BRANCH="draft/$DATE"
          TITLE="Draft edition: $DATE"
          SUMMARY_FILE="content/drafts/$DATE-summary.md"
          EDITION_FILE="content/drafts/$DATE.json"

          if [ ! -f "$EDITION_FILE" ]; then
            echo "Error: $EDITION_FILE was not generated."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to or create the date-scoped draft branch
          git checkout -B "$BRANCH"
          git add "$EDITION_FILE" "$SUMMARY_FILE"
          
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "feat(content): generate draft edition for $DATE"
          fi

          git push -u origin "$BRANCH" --force

          # Check if an existing PR is already open for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base develop --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body-file "$SUMMARY_FILE"
          else
            echo "Opening new draft PR for $BRANCH..."
            gh pr create \
              --draft \
              --base develop \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file "$SUMMARY_FILE" \
              --label "draft-edition" || true
          fi
