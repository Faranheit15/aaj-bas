name: CI/CD

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

env:
  # The landing CTA points at the reader's stable production alias, never at the
  # per-commit URL wrangler emits. A per-commit deployment URL is immutable, so
  # rolling the reader back in the Cloudflare dashboard would leave the landing page
  # still linking at the withdrawn build. ADR-0002's rollback plan depends on the
  # two applications being rollback-independent, which only this indirection gives.
  READER_PRODUCTION_URL: https://aaj-bas-web.pages.dev

concurrency:
  # Pull requests use a per-branch group so contributors' runs do not queue behind
  # one another, and a superseded run is cancelled. Pushes to develop keep the
  # shared group with cancellation off, so production deployments stay serialised.
  group: ${{ github.event_name == 'push' && 'pages-production' || format('pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run check

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      # Deployment already depends on validation: this job needs `check`, and
      # `bun run check` runs `bun run content:validate`, so a blocking finding in
      # any edition stops the deploy before it starts.
      - run: bun run --filter @aaj-bas/web build
      # The build stages only publishable editions, so this re-checks the bytes
      # that are about to be uploaded rather than the archive they came from. It
      # is the gate AB-103 built and left unwired until content reached a build:
      # a defect in the staging script cannot publish invented news past it.
      #
      # Zero staged editions is a legitimate state, not a failure. No edition has
      # been published yet, and the reader renders its no-edition state, so the
      # step reports that and passes. nullglob is load-bearing: without it bash
      # passes the literal pattern and the validator exits 2 on a usage error.
      - name: Refuse to deploy an edition that is not publishable
        shell: bash
        run: |
          shopt -s nullglob
          staged=(apps/web/dist/content/editions/*.json)
          if [ ${#staged[@]} -eq 0 ]; then
            echo "OK: no publishable edition; the reader deploys its no-edition state."
            exit 0
          fi
          bun run content:validate --publish "${staged[@]}"
      # The editions are only half of what is deployed. Every reader loads
      # `/content/latest.json` before anything else, so a corrupt pointer is not
      # one unreadable edition but the whole site answering "We could not
      # display this edition." on every route -- and until now nothing looked at
      # it after the build wrote it.
      #
      # It is checked here rather than added to the glob above, because
      # `content:validate` validates editions: handed the index, it would report
      # a perfectly good pointer as a malformed edition. This asks the published
      # index contract instead, which is the same contract the reader applies.
      #
      # An index naming no edition passes, for the same reason the step above
      # passes with none staged: that is a legitimate build, not a failure.
      - name: Refuse to deploy a pointer the reader cannot read
        run: bun run content:stage --verify-index apps/web/dist/content/latest.json
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action installs wrangler from the registry on every deploy. v4
          # changed its default from the exact 3.90.0 to the range "4", which would
          # resolve at deploy time and silently change the deploy toolchain with no
          # commit here. wrangler 4 also raises its Node floor (18 -> 20 -> 22 within
          # the 4.x line) while this workflow pins only Bun and inherits the runner's
          # Node, so a future 4.x could break production with no change to this repo.
          # Pinning keeps this bump to the action runtime alone. Moving to wrangler 4
          # is its own slice.
          wranglerVersion: "3.90.0"
          command: pages deploy apps/web/dist --project-name=aaj-bas-web --branch=develop --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-landing:
    needs: deploy-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      # The landing page ships no editions, so the publish gate lives only in
      # deploy-web. This job still depends on `check`, which validates content.
      - run: bun run --filter @aaj-bas/landing build
        env:
          VITE_APP_URL: ${{ env.READER_PRODUCTION_URL }}
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action installs wrangler from the registry on every deploy. v4
          # changed its default from the exact 3.90.0 to the range "4", which would
          # resolve at deploy time and silently change the deploy toolchain with no
          # commit here. wrangler 4 also raises its Node floor (18 -> 20 -> 22 within
          # the 4.x line) while this workflow pins only Bun and inherits the runner's
          # Node, so a future 4.x could break production with no change to this repo.
          # Pinning keeps this bump to the action runtime alone. Moving to wrangler 4
          # is its own slice.
          wranglerVersion: "3.90.0"
          command: pages deploy apps/landing/dist --project-name=aaj-bas-landing --branch=develop --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
